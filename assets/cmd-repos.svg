<svg xmlns="http://www.w3.org/2000/svg" width="264" height="64" viewBox="0 0 264 64" role="img" aria-label="$ cd ~/repos # my projects">
<style>
.on{animation:on 6.0s steps(1) infinite}@keyframes on{0%,33.2%{opacity:1}33.3%,100%{opacity:0}}
.blink{animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
</style>
<rect x="1" y="1" width="262" height="62" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>
<g class="on"><rect x="1" y="1" width="262" height="62" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="1.5"/>
<rect class="blink" x="132.2" y="16" width="8" height="17" fill="#a371f7"/></g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text x="20" y="30" fill="#58a6ff" font-weight="bold">~$</text>
<text x="45.2" y="30" fill="#c9d1d9" textLength="84.0" lengthAdjust="spacing">cd ~/repos</text>
<text x="20" y="50" fill="#8b949e" font-size="12"># my projects</text>
</g>
</svg>
